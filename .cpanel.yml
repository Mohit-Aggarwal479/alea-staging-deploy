---
deployment:
  tasks:
    - export STAGING=/home2/aleampo8/staging.aleamodular.com
    - export LIVE=/home2/aleampo8/public_html
    # --- staging (kept in sync) ---
    - /bin/cp wp-content/themes/theratio-child/functions.php "$STAGING/wp-content/themes/theratio-child/functions.php"
    - /bin/cp wp-content/mu-plugins/alea-quiet-theratio-warnings.php "$STAGING/wp-content/mu-plugins/alea-quiet-theratio-warnings.php"
    # --- live ---
    - /bin/cp wp-content/themes/theratio-child/functions.php "$LIVE/wp-content/themes/theratio-child/functions.php"
    - /bin/cp wp-content/mu-plugins/alea-quiet-theratio-warnings.php "$LIVE/wp-content/mu-plugins/alea-quiet-theratio-warnings.php"
